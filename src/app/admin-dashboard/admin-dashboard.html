<div class="dashboard-container">

    <!-- Header -->
    <header class="header">

        <div class="logo-section">
            <h2>VMS Admin</h2>
        </div>

        <div class="header-right">

            <span class="welcome-text">
                Welcome, Admin
            </span>

            <button class="logout-btn">
                Logout
            </button>

        </div>

    </header>

    <!-- Main Layout -->
    <div class="dashboard-body">

        <!-- Sidebar -->
        <aside class="sidebar">

            <ul>

                <li>
                    <a routerLink="/admin-dashboard"
                       routerLinkActive="active"
                       [routerLinkActiveOptions]="{ exact: true }">
                        🏠 Dashboard
                    </a>
                </li>

                <li>
                    <a routerLink="/admin-dashboard/section-management"
                       routerLinkActive="active">
                        🏢 Manage Sections
                    </a>
                </li>

                <li>
                    <a routerLink="/admin-dashboard/employee-management"
                       routerLinkActive="active">
                        👤 Manage Employees
                    </a>
                </li>

                <li>
                    <a routerLink="/admin-dashboard/visitor-management"
                       routerLinkActive="active">
                        🚶 Visitors
                    </a>
                </li>

            </ul>

        </aside>

        <!-- Page Content -->
        <main class="content">

            <router-outlet></router-outlet>

        </main>

    </div>

</div>
