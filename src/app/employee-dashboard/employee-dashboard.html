<div class="dashboard-container">

  <!-- =========================================
       SIDEBAR
  ========================================== -->

  <aside class="sidebar">

    <!-- Logo -->
    <div class="sidebar-logo">

      <div class="logo-box">
        VMS
      </div>

      <div class="logo-text">

        <h2>VMS</h2>

        <span>
          Visitor Management
        </span>

      </div>

    </div>


    <!-- Navigation -->
    <nav class="sidebar-nav">

      <!-- Dashboard -->

      <a
        class="nav-item"
        routerLink="/employee-dashboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }">

        <span class="nav-icon">
          ⌂
        </span>

        <span>
          Dashboard
        </span>

      </a>


      <!-- Schedule Meeting -->

      <a
        class="nav-item"
        routerLink="/employee-dashboard/meeting"
        routerLinkActive="active">

        <span class="nav-icon">
          📅
        </span>

        <span>
          Schedule Meeting
        </span>

      </a>

    </nav>


    <!-- =========================================
         SIDEBAR USER
    ========================================== -->

    <div class="sidebar-bottom">

      <div class="sidebar-user">

        <div class="user-avatar">

          {{ employeeName.charAt(0).toUpperCase() }}

        </div>

        <div class="user-details">

          <strong>
            {{ employeeName }}
          </strong>

          <span>
            Employee
          </span>

        </div>

      </div>


      <!-- Logout -->

      <button
        type="button"
        class="logout-button"
        (click)="logout()">

        <span>
          ↪
        </span>

        Logout

      </button>

    </div>

  </aside>


  <!-- =========================================
       MAIN CONTENT
  ========================================== -->

  <div class="main-content">


    <!-- =======================================
         HEADER
    ======================================== -->



    <!-- =======================================
         CHILD CONTENT

         EmployeeDashboardHome
         EmployeeMeeting
         Future modules
    ======================================== -->

    <div class="page-body">

      <router-outlet></router-outlet>

    </div>


  </div>

</div>
